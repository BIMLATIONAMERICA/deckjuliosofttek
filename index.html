document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

p:58%;width:0;height:0;z-index:3;\"><span style=\"position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:#156082;box-shadow:0 0 10px #156082;\"><\u002Fspan><\u002Fdiv>\n        <div style=\"text-align:center;margin-top:16px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#2BA6C9;font-weight:600;\">Operación directa en 6 países<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 02 CONTEXTO DEL CLIENTE ============ -->\n  <section data-label=\"El cliente\" data-screen-label=\"02\" data-speaker-notes=\"Contexto del cliente. Entre enero y diciembre de 2025 Softtek compró con BIM 383 millones de pesos, 47 veces más que en 2024, con la última compra en diciembre. No es una cuenta inactiva: es una cuenta que creció más rápido de lo que la conversamos. El pico de enero-febrero (242M en portátiles, monitores y periféricos) coincide mes a mes con el plan de expansión que anunciaron públicamente: USD 60M para su nuevo centro global de entrega en Bogotá, más de 1.000 nuevos puestos, 893 empleados en 2026 e ingresos netos creciendo 12,7%. No fuimos solo un proveedor de hardware: fuimos parte de la ejecución de ese plan. Fuentes: comunicados de Softtek e Invest in Bogotá, EMIS 2026, historial de compra BIM.\" style=\"padding:80px 110px;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#0C2438;\">\n    <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(43,166,201,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,166,201,.05) 1px,transparent 1px);background-size:64px 64px;animation:bimGrid 75s linear infinite;-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 10%,transparent 76%);mask-image:radial-gradient(ellipse at 30% 40%,#000 10%,transparent 76%);pointer-events:none;\"><\u002Fdiv>\n    <img src=\"2080ba07-e805-4eef-8818-b7c13ce2c7d9\" alt=\"bim\" st  Proyección: nuestra línea de ciberseguridad creció +256% entre 2022 y 2025, una línea que Softtek aún no ha probado con nosotros.\" style=\"padding:78px 110px;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#0A1E30;\">\n    <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(43,166,201,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,166,201,.05) 1px,transparent 1px);background-size:64px 64px;animation:bimGrid 80s linear infinite;-webkit-mask-image:radial-gradient(ellipse at center,#000 14%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 14%,transparent 80%);pointer-events:none;\"><\u002Fdiv>\n    <img src=\"2080ba07-e805-4eef-8818-b7c13ce2c7d9\" alt=\"bim\" style=\"position:absolute;top:46px;right:56px;height:28px;width:auto;opacity:.85;z-index:6;\">\n    <div style=\"position:relative;max-width:1720px;width:100%;\">\n      <span style=\"display:block;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#2BA6C9;font-weight:600;margin-bottom:14px;\">Quiénes somos · BIM Latinoamérica<\u002Fspan>\n      <h2 style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:50px;line-height:1.08;letter-spacing:-.02em;margin:0 0 36px;max-width:1450px;\"><strong style=\"font-weight:700;\">bim.<\u002Fstrong> = <span style=\"color:#2BA6C9;\">B<\u002Fspan>alance entre <span style=\"color:#2BA6C9;\">I<\u002Fspan>nnovación y <span style=\"color:#2BA6C9;\">M<\u002Fspan>etodología<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(200,212,224,.12);border:1px solid rgba(200,212,224,.12);border-radius:16px;overflow:hidden;margin-bottom:26px;\">\n        <div style=\"background:#0E2841;padding:26px 24px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:42px;line-height:1;color:#2BA6C9;\">+10<\u002Fdiv><div style=\"margin-top:8px;font-size:16px;line-height:1.35;color:#C8D4E0;\">Años de experiencia<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0E2841;padding:26px 24px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:42px;line-height:1;color:#fff;\">+600<\u002Fdiv><div style=\"margin-top:8px;font-size:16px;line-height:1.35;color:#C8D4E0;\">Clientes activos<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0E2841;padding:26px 24px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:42px;line-height:1;color:#2BA6C9;\">40<\u002Fdiv><div style=\"margin-top:8px;font-size:16px;line-height:1.35;color:#C8D4E0;\">Fabricantes en portafolio<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0E2841;padding:26px 24px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:42px;line-height:1;color:#fff;\">6<\u002Fdiv><div style=\"margin-top:8px;font-size:16px;line-height:1.35;color:#C8D4E0;\">Países con operación directa<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0E2841;padding:26px 24px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:42px;line-height:1;color:#2BA6C9;\">3<\u002Fdiv><div style=\"margin-top:8px;font-size:16px;line-height:1.35;color:#C8D4E0;\">Entidades: BIM Latinoamérica · BIM Perú · Graitec<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-stagger=\"\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;\">\n        <div class=\"bimcard\" style=\"padding:26px 28px;background:rgba(14,40,65,.7);border:1px solid rgba(200,212,224,.12);border-radius:16px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;color:#2BA6C9;margin-bottom:10px;\">UNIDAD<\u002Fdiv><h3 style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:23px;margin:0;\">Hardware &amp; equipamiento<\u002Fh3><\u002Fdiv>\n        <div class=\"bimcard\" style=\"padding:26px 28px;background:rgba(14,40,65,.7);border:1px solid rgba(200,212,224,.12);border-radius:16px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;color:#2BA6C9;margin-bottom:10px;\">UNIDAD<\u002Fdiv><h3 style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:23px;margin:0;\">Licenciamiento corporativo<\u002Fh3><\u002Fdiv>\n        <div class=\"bimcard\" style=\"padding:26px 28px;background:rgba(43,166,201,.1);border:1px solid rgba(43,166,201,.35);border-radius:16px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;color:#2BA6C9;margin-bottom:10px;\">UNIDAD · +256% 2022–2025<\u002Fdiv><h3 style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:23px;margin:0;\">Ciberseguridad<\u002Fh3><\u002Fdiv>\n        <div class=\"bimcard\" style=\"padding:26px 28px;background:rgba(14,40,65,.7);border:1px solid rgba(200,212,224,.12);border-radius:16px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;color:#2BA6C9;margin-bottom:10px;\">UNIDAD<\u002Fdiv><h3 style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:23px;margin:0;\">AEC · Autodesk &amp; Graitec<\u002Fh3><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 04 CONTEXTO NACIONAL + PREGUNTA ============ -->\n  <section data-label=\"Por qué ahora\" data-screen-label=\"04\" data-speaker-notes=\"Contexto que justifica la conversación. Crecer rápido en TI casi siempre significa perder visibilidad de lo ya comprado: según Zylo, el 53% de las licencias SaaS terminan subutilizadas; el mercado de gestión de activos TI (ITAM) creció cerca de 9% en 2025 porque el costo de no tener visibilidad crece con la plantilla. Y el dato propio: de las 66 compras que Softtek ha hecho con nosotros, cero corresponden a ciberseguridad. La pregunta que nos trae hoy: si su operación va a duplicarse, ¿su estrategia de proveedores está diseñada para escalar, o sigue dispersa entre quien ofrezca el mejor precio ese mes? No la hacemos para vendernos como respuesta automática; la hacemos porque comprar al mejor precio mes a mes tiene sentido transaccional, pero no necesariamente cuando la operación crece a este ritmo. Fuentes: Zylo, reporte de mercado ITAM 2025, historial BIM.\" style=\"padding:84px 110px;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#0E2841;\">\n    <img src=\"2080ba07-e805-4eef-8818-b7c13ce2c7d9\" alt=\"bim\" style=\"position:absolute;top:46px;right:56px;height:28px;width:auto;opacity:.85;z-index:6;\">\n    <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1100px;height:1100px;border-radius:50%;background:rgba(43,166,201,.09);filter:blur(40px);\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1620px;width:100%;\">\n      <span style=\"display:block;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#2BA6C9;font-weight:600;margin-bottom:18px;\">La pregunta que nos trae hoy<\u002Fspan>\n      <h2 style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:52px;line-height:1.12;letter-spacing:-.02em;margin:0 0 44px;max-width:1500px;\">Si su operación va a duplicarse, <span style=\"color:#2BA6C9;\">¿su estrategia de proveedores está diseñada para escalar, o sigue dispersa entre quien ofrezca el mejor precio ese mes?<\u002Fspan><\u002Fh2>\n      <div data-stagger=\"\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;\">\n        <div class=\"bimcard\" style=\"padding:34px 36px;background:rgba(14,40,65,.7);border:1px solid rgba(200,212,224,.12);border-radius:16px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:60px;line-height:1;color:#2BA6C9;\">53%<\u002Fdiv><div style=\"margin-top:14px;font-size:20px;line-height:1.4;color:#C8D4E0;\">De licencias SaaS subutilizadas o sin uso <span style=\"color:rgba(200,212,224,.55);\">(Zylo)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"bimcard\" style=\"padding:34px 36px;background:rgba(14,40,65,.7);border:1px solid rgba(200,212,224,.12);border-radius:16px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:60px;line-height:1;color:#2BA6C9;\">+9%<\u002Fdiv><div style=\"margin-top:14px;font-size:20px;line-height:1.4;color:#C8D4E0;\">Crecimiento del mercado de gestión de activos TI en 2025<\u002Fdiv><\u002Fdiv>\n        <div class=\"bimcard\" style=\"padding:34px 36px;background:rgba(14,40,65,.7);border:1px solid rgba(43,166,201,.4);border-radius:16px;\"><div style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:52px;line-height:1;color:#fff;\">0 / 66<\u002Fdiv><div style=\"margin-top:14px;font-size:20px;line-height:1.4;color:#C8D4E0;\">Compras de ciberseguridad de Softtek con BIM hasta hoy<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 05 ETAPA CONSULTIVA ============ -->\n  <section data-label=\"Etapa consultiva\" data-screen-label=\"05\" data-speaker-notes=\"Nuestra propuesta de trabajo, en etapa consultiva. Operación actual: escuchar el plan, no solo el pedido — entender cuántas personas se suman y cuándo para anticipar en vez de reaccionar, y hacer que cotizar con BIM sea el camino más simple para Compras. Mejora continua y optimización: planificar las oleadas de contratación, gestionar el ciclo de vida de los equipos (garantías, renovaciones, reemplazo planificado) y anticipar la siguiente ola de equipamiento. Complementos y seguimiento: sumar sin fricción la ciberseguridad al onboarding, centralizar la gestión de licencias y dar seguimiento como un solo interlocutor. El objetivo no es ganar la próxima cotización al precio más bajo, es que Softtek vea en BIM un canal que genera valor, no solo precio.\" style=\"padding:80px 110px;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#0A1E30;\">\n    <div style=\"position:absolute;inset:0;background-image:line  08 CIERRE ============ -->\n  <section data-label=\"El siguiente paso\" data-screen-label=\"08\" data-speaker-notes=\"Cierre. No buscamos ganar la próxima cotización: buscamos ser el socio de su expansión. Proponemos una Sesión de Mapeo de Procesos con el área de Compras, enfocada en planificar el siguiente ciclo de equipamiento según su calendario real de contratación y mostrar dónde la ciberseguridad puede sumarse sin fricción al onboarding. Preparado por Anyela Reyes, BIM Latinoamérica.\" style=\"padding:110px;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#08182A;\">\n    <div style=\"position:absolute;top:-12%;left:50%;transform:translateX(-50%);width:1200px;height:780px;border-radius:50%;background:rgba(43,166,201,.12);filter:blur(40px);\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1500px;\">\n      <span style=\"display:block;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#2BA6C9;font-weight:600;margin-bottom:30px;\">El siguiente paso<\u002Fspan>\n      <h2 style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:76px;line-height:1.04;letter-spacing:-.03em;margin:0 0 38px;max-width:1300px;\">No buscamos ganar la próxima cotización.<br>Buscamos ser <span style=\"color:#2BA6C9;\">el socio de su expansión.<\u002Fspan><\u002Fh2>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-bottom:46px;\">\n        <span style=\"font-size:22px;padding:12px 24px;border-radius:999px;background:rgba(43,166,201,.12);border:1px solid rgba(43,166,201,.3);color:#C8D4E0;\">Planificar el próximo ciclo de equipamiento<\u002Fspan>\n        <span style=\"font-size:22px;padding:12px 24px;border-radius:999px;background:rgba(43,166,201,.12);border:1px solid rgba(43,166,201,.3);color:#C8D4E0;\">Sumar ciberseguridad al onboarding<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"#\" class=\"bimbtn\" style=\"display:inline-block;background:#2BA6C9;color:#06121F;font-family:'Outfit',sans-serif;font-weight:700;font-size:22px;padding:22px 48px;border-radius:999px;text-decoration:none;box-shadow:0 12px 40px rgba(43,166,201,.35);\">Agendar Sesión de Mapeo de Procesos<\u002Fa>\n      <div style=\"margin-top:72px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(200,212,224,.12);padding-top:28px;max-width:1300px;font-size:17px;color:rgba(200,212,224,.6);\">\n        <span style=\"display:flex;align-items:center;gap:14px;\"><img src=\"2080ba07-e805-4eef-8818-b7c13ce2c7d9\" alt=\"bim\" style=\"height:24px;width:auto;opacity:.9;\"> Construimos Certeza.<\u002Fspan>\n        <span>Preparado para Softtek Colombia por Anyela Reyes, BIM Latinoamérica<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<div id=\"bxcursor\" style=\"position:fixed;top:0;left:0;width:30px;height:30px;border:1.5px solid rgba(43,166,201,.8);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9999;mix-blend-mode:screen;transition:width .25s,height .25s,background .25s,border-color .25s;display:none;\"><\u002Fdiv>\n<button id=\"bxrail\" title=\"Mostrar/ocultar miniaturas\" style=\"position:fixed;left:74px;bottom:20px;z-index:9000;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:11px;border:1px solid rgba(200,212,224,.22);background:rgba(6,18,31,.55);backdrop-filter:blur(8px);color:#C8D4E0;font-size:18px;cursor:pointer;\">▤<\u002Fbutton>\n<button id=\"bxfs\" title=\"Pantalla completa\" style=\"position:fixed;left:22px;bottom:20px;z-index:9000;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:11px;border:1px solid rgba(200,212,224,.22);background:rgba(6,18,31,.55);backdrop-filter:blur(8px);color:#C8D4E0;font-size:18px;cursor:pointer;\">⛶<\u002Fbutton>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const easeOut = t => 1 - Math.pow(1 - t, 3);\n    const countUp = (el) => {\n      const target = parseFloat(el.getAttribute('data-count')) || 0;\n      const prefix = el.getAttribute('data-prefix') || '';\n      const suffix = el.getAttribute('data-suffix') || '';\n      const dur = 1300, start = performance.now();\n      const step = (now) => {\n        const p = Math.min((now - start) / dur, 1);\n        el.textContent = prefix + Math.round(target * easeOut(p)) + suffix;\n        if (p < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n    };\n    const runSlide = (slide) => {\n      if (!slide || !slide.querySelectorAll) return;\n      slide.querySelectorAll('[data-count]').forEach(countUp);\n      slide.querySelectorAll('[data-stagger]').forEach(wrap => {\n        Array.from(wrap.children).forEach((c, i) => {\n          c.style.opacity = '0';\n          c.style.transform = 'translateY(18px) scale(.95)';\n          c.style.transition = 'opacity .5s ease, transform .5s ease';\n          setTimeout(() => { c.style.opacity = '1'; c.style.transform = 'none'; }, 55 * i);\n        });\n      });\n    };\n    const wireStage = (stage) => {\n      stage.addEventListener('slidechange', (e) => runSlide(e.detail && e.detail.slide));\n      const slides = document.querySelectorAll('section[data-label]');\n      const idx = (typeof stage._index === 'number') ? stage._index : 0;\n      runSlide(slides[idx]);\n    };\n    let _st = 0;\n    const findStage = () => { const s = document.querySelector('deck-stage'); if (s) wireStage(s); else if (_st++ < 50) setTimeout(findStage, 150); };\n    findStage();\n\n    const isFine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;\n\n    if (isFine) {\n      const cur = document.querySelector('#bxcursor');\n      if (cur) {\n        cur.style.display = 'block';\n        let cx = innerWidth / 2, cy = innerHeight / 2, tx = cx, ty = cy;\n        window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });\n        const cl = () => { cx += (tx - cx) * 0.22; cy += (ty - cy) * 0.22; cur.style.transform = 'translate(' + cx + 'px,' + cy + 'px) translate(-50%,-50%)'; requestAnimationFrame(cl); };\n        cl();\n        const grow = () => { cur.style.width = '52px'; cur.style.height = '52px'; cur.style.background = 'rgba(43,166,201,.14)'; };\n        const shrink = () => { cur.style.width = '30px'; cur.style.height = '30px'; cur.style.background = 'transparent'; };\n        document.addEventListener('mouseover', e => { if (e.target.closest('.bimcard,.bimchip,.bimbtn,button,a,summary')) grow(); else shrink(); });\n      }\n    }\n\n    const rail = document.querySelector('#bxrail');\n    if (rail) rail.addEventListener('click', () => {\n      const stage = document.querySelector('deck-stage');\n      if (!stage) return;\n      if (stage.hasAttribute('no-rail')) stage.removeAttribute('no-rail');\n      else stage.setAttribute('no-rail', '');\n    });\n\n    const fs = document.querySelector('#bxfs');\n    if (fs) fs.addEventListener('click', () => {\n      const d = document;\n      if (!d.fullscreenElement) { (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (()=>{})).call(d.documentElement); fs.textContent = '⛗'; }\n      else { (d.exitFullscreen || d.webkitExitFullscreen || (()=>{})).call(d); fs.textContent = '⛶'; }\n    });\n\n    (function () {\n      let cv = null, ctx = null, W = 0, H = 0, DPR = 1, pts = [], mouse = { x: -9999, y: -9999 };\n      const build = () => { const n = Math.min(130, Math.round(W * H / 15000)); pts = []; for (let i = 0; i < n; i++) pts.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35 }); };\n      const sync = () => {\n        const live = document.querySelector('#bxnet');\n        if (!live) return false;\n        if (live !== cv) { cv = live; ctx = cv.getContext('2d'); }\n        DPR = Math.min(2, window.devicePixelRatio || 1);\n        const w = cv.offsetWidth || cv.getBoundingClientRect().width, h = cv.offsetHeight || cv.getBoundingClientRect().height;\n        if (w && h && (Math.abs(w - W) > 1 || Math.abs(h - H) > 1 || cv.width !== Math.round(w * DPR))) {\n          W = w; H = h; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); build();\n        }\n        return !!(W && H);\n      };\n      window.addEventListener('mousemove', (e) => {\n        if (!cv) return;\n        const r = cv.getBoundingClientRect();\n        const mx = e.clientX - r.left, my = e.clientY - r.top;\n        if (mx >= 0 && my >= 0 && mx <= r.width && my <= r.height && r.width) { mouse.x = mx * (W / r.width); mouse.y = my * (H / r.height); }\n        else { mouse.x = -9999; mouse.y = -9999; }\n      });\n      setInterval(sync, 400);\n      const draw = () => {\n        if (sync()) {\n          ctx.clearRect(0, 0, W, H);\n          for (const p of pts) {\n            p.x += p.vx; p.y += p.vy;\n            if (p.x < 0 || p.x > W) p.vx *= -1;\n            if (p.y < 0 || p.y > H) p.vy *= -1;\n            const dxm = p.x - mouse.x, dym = p.y - mouse.y, dm = Math.hypot(dxm, dym);\n            if (dm < 160) { p.x += dxm / dm * 1.0; p.y += dym / dm * 1.0; }\n          }\n          for (let i = 0; i < pts.length; i++) {\n            const a = pts[i];\n            for (let j = i + 1; j < pts.length; j++) {\n              const b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);\n              if (d < 130) { ctx.strokeStyle = 'rgba(43,166,201,' + (0.18 * (1 - d / 130)) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }\n            }\n            const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);\n            if (dm < 160) { ctx.strokeStyle = 'rgba(120,200,230,' + (0.34 * (1 - dm / 160)) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }\n          }\n          for (const p of pts) { ctx.fillStyle = 'rgba(130,195,225,.7)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.7, 0, 6.283); ctx.fill(); }\n        }\n        requestAnimationFrame(draw);\n      };\n      sync(); draw();\n    })();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
